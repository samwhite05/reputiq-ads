<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1120">
<title>ReputIQ ads</title>
<meta property="og:title" content="ReputIQ ads">
<meta property="og:image" content="https://samwhite05.github.io/reputiq-ads/kettle.jpg">
<style>
  * { box-sizing: border-box; margin: 0; }
  html { background: #0B1120; }
  body {
    min-height: 100dvh;
    padding: 32px 16px calc(48px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, #0B1120, #131B2E);
    color: #F8FAFB;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; justify-content: center; margin-bottom: 32px; }
  header img { display: block; width: 150px; height: auto; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 40px;
    max-width: 420px;
    margin: 0 auto;
  }
  h2 { margin-bottom: 12px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  video {
    display: block;
    width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 16px;
    background: #1A2438;
  }
  @media (min-width: 1000px) {
    main { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; max-width: 1200px; }
  }
</style>
</head>
<body>
<header><img src="logo.png" alt="ReputIQ" width="1200" height="300"></header>
<main>
  <section>
    <h2>Kettle</h2>
    <video src="kettle.mp4" poster="kettle.jpg" controls playsinline preload="metadata"></video>
  </section>
  <section>
    <h2>Silence</h2>
    <video src="silence.mp4" poster="silence.jpg" controls playsinline preload="metadata"></video>
  </section>
  <section>
    <h2>The Number</h2>
    <video src="number.mp4" poster="number.jpg" controls playsinline preload="metadata"></video>
  </section>
</main>
<script>
  // Starting one video stops the others, so two soundtracks never overlap.
  const videos = document.querySelectorAll('video');
  videos.forEach(v => v.addEventListener('play', () => {
    videos.forEach(other => { if (other !== v) other.pause(); });
  }));
</script>
</body>
</html>
